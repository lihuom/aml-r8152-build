name: build-r8152-ko

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'out/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf bc flex bison libelf-dev
          arm-linux-gnueabihf-gcc --version | head -1

      - name: Fetch kernel 4.9.113
        run: |
          curl -sSL --retry 3 --max-time 600 -o /tmp/linux.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.113.tar.xz
          ls -l /tmp/linux.tar.xz
          tar -xf /tmp/linux.tar.xz -C /tmp
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' /tmp/linux-4.9.113/Makefile

      - name: Configure from box
        run: |
          cp box.config /tmp/linux-4.9.113/.config
          sed -i 's|^# CONFIG_USB_RTL8152 is not set|CONFIG_USB_RTL8152=m|' /tmp/linux-4.9.113/.config
          echo "--- rtl8152 line ---"
          grep -n 'CONFIG_USB_RTL8152' /tmp/linux-4.9.113/.config
          cd /tmp/linux-4.9.113
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig 2>&1 | tail -15
          echo "--- key opts after olddefconfig ---"
          grep -E '^CONFIG_(USB_RTL8152|MODVERSIONS|SMP|PREEMPT|MODULE_UNLOAD|CPU_V7)=' .config

      - name: Prepare kernel build
        run: |
          cd /tmp/linux-4.9.113
          : > /tmp/build.log
          echo "===== make prepare =====" | tee -a /tmp/build.log
          make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- prepare 2>&1 | tee -a /tmp/build.log | tail -20
          echo "===== modules_prepare =====" | tee -a /tmp/build.log
          make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare 2>&1 | tee -a /tmp/build.log | tail -20
          echo "===== make scripts (recordmcount etc.) =====" | tee -a /tmp/build.log
          make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
            HOSTCFLAGS="-Wall -O2 -fcommon -std=gnu89" \
            scripts 2>&1 | tee -a /tmp/build.log | tail -20 || true
          if [ ! -x scripts/recordmcount ]; then
            echo "===== FALLBACK: manual recordmcount build =====" | tee -a /tmp/build.log
            ( cd scripts && cc -O2 -fcommon -o recordmcount recordmcount.c elf.c ) 2>&1 | tee -a /tmp/build.log || true
          fi
          echo "===== scripts check =====" | tee -a /tmp/build.log
          ls -l scripts/recordmcount scripts/mod/modpost scripts/basic/fixdep 2>&1 | tee -a /tmp/build.log
          echo "===== generated headers =====" | tee -a /tmp/build.log
          ls -l include/generated/bounds.h include/generated/asm-offsets.h include/generated/autoconf.h 2>&1 | tee -a /tmp/build.log

      - name: Fetch Realtek official r8152 driver (v2.22.1)
        run: |
          curl -sSL --retry 3 --max-time 300 -o /tmp/r8152-rtl.tar.gz \
            https://github.com/wget/realtek-r8152-linux/archive/v2.22.1.20261021.tar.gz
          ls -l /tmp/r8152-rtl.tar.gz | tee -a /tmp/build.log
          tar -xf /tmp/r8152-rtl.tar.gz -C /tmp
          D=$(ls -d /tmp/realtek-r8152-linux-* | head -1)
          echo "===== driver dir: $D =====" | tee -a /tmp/build.log
          ls -la "$D" | tee -a /tmp/build.log
          cd /tmp/linux-4.9.113
          cp "$D"/r8152.c drivers/net/usb/r8152.c
          for h in "$D"/*.h; do [ -f "$h" ] && cp "$h" drivers/net/usb/; done
          echo "===== installed into kernel tree =====" | tee -a /tmp/build.log
          ls -l drivers/net/usb/r8152* | tee -a /tmp/build.log
          grep -nE 'MODULE_VERSION|RTL8153B|0x6010' drivers/net/usb/r8152.c | head -10 | tee -a /tmp/build.log

      - name: Patch official driver for 4.9
        run: |
          python3 "$GITHUB_WORKSPACE/patch_official.py" 2>&1 | tee -a /tmp/build.log

      - name: Inject real CRCs from box vmlinux
        run: |
          cp Module.symvers /tmp/linux-4.9.113/Module.symvers
          wc -l /tmp/linux-4.9.113/Module.symvers
          echo "--- spot check ---"
          grep -P '^0x[0-9a-f]+\t(usbnet_probe|netif_carrier_on|usbnet_cdc_bind)\t' /tmp/linux-4.9.113/Module.symvers || true

      - name: Build r8152.ko
        run: |
          cd /tmp/linux-4.9.113
          echo "===== build module =====" | tee -a /tmp/build.log
          make V=1 -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
            KCFLAGS="-march=armv7-a -Wa,-march=armv7-a -fno-stack-protector" \
            M=drivers/net/usb modules 2>&1 | tee -a /tmp/build.log
          echo "=== undefined symbol check ==="
          if grep -i 'undefined' /tmp/build.log; then echo "FOUND_UNDEFINED"; else echo "none"; fi

      - name: Collect results
        if: always()
        run: |
          rm -rf out
          mkdir -p out
          KO=/tmp/linux-4.9.113/drivers/net/usb/r8152.ko
          if [ -f "$KO" ]; then
            cp -v "$KO" out/
            file out/r8152.ko
            echo "=== .modinfo ==="
            arm-linux-gnueabihf-readelf -p .modinfo out/r8152.ko > out/modinfo.txt 2>&1 || true
            cat out/modinfo.txt || true
            echo "=== .versions ==="
            arm-linux-gnueabihf-readelf -x .versions out/r8152.ko > out/versions.txt 2>&1 || true
            head -10 out/versions.txt || true
          else
            echo "KO_NOT_BUILT" > out/NO_KO.txt
          fi
          cp -v /tmp/build.log out/ 2>/dev/null || true
          ls -l out

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out
          git commit -m "build: r8152.ko artifact [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8152-ko
          path: |
            out/r8152.ko
            out/build.log
